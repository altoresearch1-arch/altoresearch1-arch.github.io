name: Robot diario y despliegue

# ─────────────────────────────────────────────────────────────────────────
#  ¿Qué hace esto?
#  - CIERRE (noche, Lun-Vie): baja TODO lo diario (precios, históricos,
#    dividendos, hechos, BEM), commitea y republica. Igual que siempre.
#  - HECHOS (cada 30 min, horario de mercado): solo Hechos de Importancia +
#    BEM. El BEM es MENSUAL (fetch_bem tiene caché y no hace ruido), pero los
#    hechos sí caen a cualquier hora → la web los muestra casi en vivo.
#  - PRECIOS + PRENSA (CADA 10 MIN, 9:00-16:59 Perú): refresca precio,
#    históricos, el acumulador intradía y el barrido de portadas (Perú y
#    mundo). La red dirigida de Google News NO va acá — serían ~4,560
#    consultas diarias y Google corta mucho antes; esa corre en el cierre.
#    OJO CON EL RUIDO: con ~48 corridas al día, el repo puede recibir decenas
#    de commits de datos por jornada. Se commitea solo si algo cambió, pero en
#    horario de mercado los precios cambian casi siempre.
#  - Solo se COMMITEA Y REPUBLICA si los datos realmente cambiaron (si no,
#    el run termina en ~1 min sin tocar nada — cero ruido en el historial).
#  - La PC de Jair NO necesita estar prendida: todo corre en GitHub
#    (gratis e ilimitado para repos públicos).
#  - También publica al hacer push a main y hay botón "Run workflow".
# ─────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # GitHub usa UTC; Perú es UTC-5 todo el año. Por eso el desfase.
    # OJO (visto 09-jul): GitHub RETRASA los crones agendados en minutos "congestionados"
    # (:00 y :30 en punto, donde agenda todo el mundo) — el cierre de las 03:00 llegó a
    # correr 7 horas tarde. Por eso usamos :07/:37/:23: minutos impares = menos cola.
    # El cron de Actions es "mejor esfuerzo": puede correrse unos minutos, no es un reloj suizo.
    # 1) CIERRE: 03:23 UTC mar-sáb == 22:23 Lun-Vie en Perú (tras el cierre BVL).
    - cron: '23 3 * * 2-6'
    # 2) HECHOS+BEM: :07 y :37 de cada hora. Los Hechos de Importancia (y el BEM del
    #    MINEM) salen a CUALQUIER hora — también de tarde/noche: Los Portales 17:47,
    #    Credicorp 20:08 (vistos 10-jul). Antes la ventana moría 16:37 y esos hechos
    #    recién los agarraba el cierre de las 22:23 (horas tarde). Ahora se cubre todo
    #    el día laboral hasta la noche, en cadencia continua de 30 min:
    #    a) 13-23 UTC == 8:07 a 18:37 Perú (Lun-Vie).
    - cron: '7,17,27,37,47,57 13-23 * * 1-5'
    #    b) 0-2 UTC == 19:07 a 21:37 Perú. OJO: en UTC eso ya es el día SIGUIENTE,
    #       por eso el rango de días es 2-6 (mar-sáb UTC = lun-vie noche en Perú).
    - cron: '7,17,27,37,47,57 0-2 * * 2-6'
    # 3) PRECIOS + PRENSA: CADA 10 MINUTOS en horario de rueda.
    #    14-21 UTC == 9:00 a 16:59 Perú, Lun-Vie. Son ~48 corridas por día.
    #
    #    QUÉ CORRE Y QUÉ NO, con la cuenta hecha (02-ago-2026):
    #      · precios      1 POST a la BVL por corrida ->    48/día   trivial
    #      · barrido Perú  8 feeds RSS               ->   384/día = 48 por medio
    #      · barrido mundo 5 feeds RSS               ->   240/día = 48 por medio
    #      · red DIRIGIDA de Google News: ~95 consultas por corrida
    #        ->  ¡4,560 al día!  Esa NO corre acá: Google corta mucho antes, y
    #        además llega tarde igual (tarda en indexar). Sigue en el cierre.
    #
    #    Minutos 3,13,...,53 y no 0,10,...,50: GitHub agenda peor los minutos
    #    "redondos" y ahí el cron se retrasa (visto 09-jul, el de las 03:00 corrió
    #    7 horas tarde). El cron de Actions es mejor esfuerzo, no un reloj.
    #    Va PARTIDO EN DOS, y es la decisión de diseño que más ahorra:
    #      a) :03 y :33 -> corre Y DESPLIEGA. La web se refresca cada 30 min.
    #      b) el resto  -> corre y COMMITEA, pero NO despliega.
    #    Por qué: cada despliegue es build de la PWA + Pages (minutos, y las
    #    colas de Pages se pisan entre sí). 48 al día no le sirven a nadie —
    #    nadie mira la página cada 10 minutos. Los COMMITS sí valen los 48: el
    #    historial de git resultó ser el único archivo intradía que existía
    #    (descubierto 02-ago-2026, 29 commits con hora), así que commitear
    #    seguido no es ruido, es el archivo.
    - cron: '3,33 14-21 * * 1-5'
    - cron: '13,23,43,53 14-21 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch: {}   # botón manual "Run workflow" en la pestaña Actions

# Permisos MÍNIMOS del token automático (GITHUB_TOKEN):
#   contents: write        -> el robot commitea los JSON actualizados al repo
#   pages: write / id-token -> publicar en GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancelar el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) En los runs programados o a mano: refresca los datos y los guarda en el repo.
  actualizar-datos:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      cambios: ${{ steps.commit.outputs.cambios }}
      # 'no' en las corridas de datos puros: se commitea el JSON pero NO se
      # rehace la web. Así el archivo intradía queda completo y Pages solo
      # trabaja cada 30 min.
      desplegar: ${{ steps.modo.outputs.desplegar }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del extractor
        run: pip install -r extractor/requirements.txt

      - name: Elegir el modo según qué cron disparó
        id: modo
        # github.event.schedule trae el cron EXACTO que disparó este run.
        # A mano (workflow_dispatch) se corre el modo completo del robot (--rapido).
        run: |
          # 'desplegar' decide si además de commitear se rehace la web.
          case "${{ github.event.schedule }}" in
            '7,17,27,37,47,57 13-23 * * 1-5'|'7,17,27,37,47,57 0-2 * * 2-6')
              echo "flag=--hechos"  >> "$GITHUB_OUTPUT"
              echo "etiqueta=hechos/BEM cada 10 min" >> "$GITHUB_OUTPUT"
              echo "desplegar=si" >> "$GITHUB_OUTPUT" ;;
            '3,33 14-21 * * 1-5')
              echo "flag=--precios" >> "$GITHUB_OUTPUT"
              echo "etiqueta=precios+prensa (con despliegue)" >> "$GITHUB_OUTPUT"
              echo "desplegar=si" >> "$GITHUB_OUTPUT" ;;
            '13,23,43,53 14-21 * * 1-5')
              # Sin prensa: las portadas no cambian cada 10 min y la prensa
              # llega después del Hecho. Solo precio + intradía, que sí cambian.
              echo "flag=--precios --sin-prensa" >> "$GITHUB_OUTPUT"
              echo "etiqueta=precios (solo datos)" >> "$GITHUB_OUTPUT"
              echo "desplegar=no" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "flag=--rapido"  >> "$GITHUB_OUTPUT"
              echo "etiqueta=cierre del día" >> "$GITHUB_OUTPUT"
              echo "desplegar=si" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Correr el robot (${{ steps.modo.outputs.etiqueta }})
        # --rapido: datos diarios BVL/stockanalysis (~3-4 min), salta el EPS anual del SMV
        #   (estático + flaky desde la nube; se refresca con --trimestral o a mano).
        # --hechos / --precios: modos intradía livianos (~1-2 min).
        run: python extractor/actualizar_todo.py ${{ steps.modo.outputs.flag }}

      - name: Commit de los datos frescos (si cambiaron)
        id: commit
        run: |
          git config user.name  "robot-alto"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Las cachés de PDF/xlsx viajan en el commit: sin esto, cada corrida
          # re-bajaba el BEM del MINEM y los PDF de producción (detectado 17-jul).
          git add app/src/data app/public/novedades.json extractor/cache_bem extractor/cache_produccion extractor/cache_dividendos
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos: nada que commitear ni desplegar."
            echo "cambios=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "datos: ${{ steps.modo.outputs.etiqueta }} $(TZ=America/Lima date +'%Y-%m-%d %H:%M') [skip ci]"
            # Ponerse al día con el remoto ANTES de subir (evita el rechazo 'fetch first'
            # cuando llegó otro commit mientras el robot trabajaba). -X theirs: si hubiera
            # choque en los JSON, gana el dato FRESCO del robot.
            git pull --rebase -X theirs origin main
            git push
            echo "cambios=true" >> "$GITHUB_OUTPUT"
          fi

  # 2) Build de la PWA y publicación en GitHub Pages.
  #    Corre tras 'actualizar-datos' SOLO si los datos cambiaron (o en push /
  #    disparo manual). Así los runs de cada 30 min sin novedades no gastan
  #    un despliegue de Pages.
  desplegar:
    needs: [actualizar-datos]
    if: |
      always() && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && needs.actualizar-datos.result == 'success') ||
        (needs.actualizar-datos.result == 'success'
         && needs.actualizar-datos.outputs.cambios == 'true'
         && needs.actualizar-datos.outputs.desplegar != 'no')
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # toma el commit más reciente (incluye los datos que acaba de guardar el robot)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias del front
        run: npm ci
        working-directory: app

      - name: Build de la PWA
        run: npm run build
        working-directory: app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
